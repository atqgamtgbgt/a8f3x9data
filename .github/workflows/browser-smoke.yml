name: Dashboard browser smoke

on:
  push:
    branches: [main, test/headless-browser-smoke-20261110]
    paths:
      - index.html
      - js/**
      - tools/browser_smoke_test.py
      - .github/workflows/browser-smoke.yml
  pull_request:
    paths:
      - index.html
      - js/**
      - tools/browser_smoke_test.py
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Chrome availability
        run: |
          command -v google-chrome
          google-chrome --version
          command -v chromedriver
          chromedriver --version
      - name: Install Selenium
        run: python -m pip install selenium==4.38.0
      - name: Diagnose CCCM source references
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [Path('index.html'), *Path('js').glob('*.js')]:
              text = path.read_text(encoding='utf-8')
              for needle in ('cds-archive/cccm', 'cccm/data.json'):
                  starts = []
                  at = 0
                  while len(starts) < 6:
                      i = text.find(needle, at)
                      if i < 0:
                          break
                      starts.append(i)
                      at = i+len(needle)
                  for i in starts:
                      print(path, needle, 'line', text.count('\\n', 0, i)+1,
                            repr(text[max(0,i-300):i+450]))
          PY
      - name: Start local test server
        run: |
          python -m http.server 8768 --bind 127.0.0.1 >/tmp/http-browser.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error -I http://127.0.0.1:8768/index.html
      - name: Run real desktop and mobile browser checks
        run: python tools/browser_smoke_test.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-screenshots
          path: smoke_screenshots/
          if-no-files-found: ignore
