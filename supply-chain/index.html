.viz-root {

@media (prefers-color-scheme: dark) {

    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card: #141413;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9b998f;

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--text);

header { padding: 16px 16px 8px; max-width: 1080px; margin: 0 auto; }

main { max-width: 1080px; margin: 0 auto; padding: 12px 12px 48px; }
.card { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 1px var(--ring); padding: 16px; margin: 12px 0; }
.card h2 { font-size: 17px; margin: 0 0 4px; }

.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 10px; }
select, .seg button { font: inherit; font-size: 13px; color: var(--text); background: var(--surface);

.seg { display: inline-flex; gap: 0; }

.chip { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; border-radius: 6px;

.hyp { display: grid; gap: 4px; }
.hyp h2 { font-size: 16px; }
.hyp ul { margin: 4px 0 0; padding-left: 0; list-style: none; }

.hyp li.f::before { content: "事実"; }
.hyp li.c::before { content: "相関"; }
.hyp li.h::before { content: "仮説"; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: left; vertical-align: top; }

td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
th button.sort { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }

figure svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); margin: 6px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; }
.toggle-table { font-size: 12px; margin-top: 6px; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0; }

.tile .l { font-size: 12px; color: var(--text-2); }
.tile .v { font-size: 22px; font-weight: 600; }

#tooltip { position: fixed; z-index: 30; pointer-events: none; background: var(--card); color: var(--text);

#tooltip b { font-size: 14px; }
dialog#panel { border: 0; padding: 0; width: min(760px, 100vw); max-width: 100vw; height: 100dvh; max-height: 100dvh;

.panel-head { position: sticky; top: 0; background: var(--card); display: flex; justify-content: space-between;

.panel-body { padding: 4px 16px 32px; }

.focus-row td:first-child { box-shadow: inset 3px 0 0 var(--emph); }
@media (max-width: 600px) {
