name: Main HTML diagnostic

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tools/audit_index_html.js
      - tools/localize_index_html.py
      - tools/extract_info_registry.py
      - js/info-registry.js
      - .github/workflows/index-audit.yml
  pull_request:
    paths:
      - index.html
      - tools/audit_index_html.js
      - tools/localize_index_html.py
      - tools/extract_info_registry.py
      - js/info-registry.js
      - .github/workflows/index-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check diagnostic script syntax
        run: node --check tools/audit_index_html.js
      - name: Reject reintroduced Chinese UI labels
        run: python tools/localize_index_html.py --check
      - name: Verify extracted info registry and script syntax
        run: |
          python tools/extract_info_registry.py --check
          node --check js/info-registry.js
      - name: Audit main page JavaScript and localization
        run: node tools/audit_index_html.js
