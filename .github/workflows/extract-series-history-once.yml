name: One-time series history extraction

on:
  push:
    branches:
      - refactor/extract-series-history-20261110
    paths:
      - tools/extract_series_history.py
      - .github/workflows/extract-series-history-once.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check extraction script
        run: python -m py_compile tools/extract_series_history.py
      - name: Extract 303KB JavaScript block
        run: |
          python tools/extract_series_history.py --apply
          python tools/extract_series_history.py --check
          node --check js/series-history.js
      - name: Check page syntax and labels
        run: |
          node tools/audit_index_html.js | tee /tmp/index-audit.log
          grep -q 'Inline classic scripts checked: 19; external scripts: 6; skipped/module/data scripts: 0; syntax errors: 0' /tmp/index-audit.log
          python tools/localize_index_html.py --check
          python tools/localize_additional_text.py --check
          python tools/extract_info_registry.py --check
          git -c core.whitespace=cr-at-eol diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Check both JS assets served over HTTP
        run: |
          python -m http.server 8766 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8766/index.html
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8766/js/info-registry.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8766/js/series-history.js
      - name: Commit isolated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/series-history.js
          git commit -m "Extract generated SERIES_HISTORY into synchronous JS asset"
          git push origin HEAD:refactor/extract-series-history-20261110
