name: Dashboard browser smoke

on:
  push:
    branches:
      - test/headless-browser-smoke-20261110
    paths:
      - tools/browser_smoke_test.py
      - .github/workflows/browser-smoke.yml
  pull_request:
    paths:
      - index.html
      - js/**
      - tools/browser_smoke_test.py
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Chrome availability
        run: |
          command -v google-chrome
          google-chrome --version
          command -v chromedriver
          chromedriver --version
      - name: Install Selenium
        run: python -m pip install selenium==4.38.0
      - name: Start local test server
        run: |
          python -m http.server 8768 --bind 127.0.0.1 >/tmp/http-browser.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error -I http://127.0.0.1:8768/index.html
      - name: Run real desktop and mobile browser checks
        run: python tools/browser_smoke_test.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-screenshots
          path: smoke_screenshots/
          if-no-files-found: ignore
