#tooltip b { font-size: 14px; }

.panel-head { position: sticky; top: 0; background: var(--card); display: flex; justify-content: space-between;

.panel-head h2 { margin: 0; font-size: 18px; }
.panel-body { padding: 4px 16px 32px; }

.focus-row td:first-child { box-shadow: inset 3px 0 0 var(--emph); }

}
.card { border-radius: 16px; padding: 22px 24px; margin: 14px 0; }

/* ページ冒頭の２つの図。スマホでも棒と数値が横にはみ出さない構成 */
.visual-first { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
