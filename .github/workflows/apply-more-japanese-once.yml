name: One-time Japanese static text update

on:
  push:
    branches:
      - fix/more-japanese-static-20261110
    paths:
      - tools/localize_additional_text.py
      - .github/workflows/apply-more-japanese-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate localization script syntax
        run: python -m py_compile tools/localize_additional_text.py
      - name: Translate only visible HTML text nodes
        run: |
          python tools/localize_additional_text.py --apply
          python tools/localize_additional_text.py --check
      - name: Validate main-page scripts and source safety
        run: |
          node tools/audit_index_html.js | tee /tmp/index-audit.log
          grep -q 'syntax errors: 0' /tmp/index-audit.log
          python tools/localize_index_html.py --check
          python tools/extract_info_registry.py --check
          git -c core.whitespace=cr-at-eol diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit only the modified main page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Localize remaining visible Chinese UI text"
          git push origin HEAD:fix/more-japanese-static-20261110
